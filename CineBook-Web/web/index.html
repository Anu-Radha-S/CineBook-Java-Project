<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="index.html">Cine<span>Book</span></a>
            <nav class="nav">
                <a href="index.html" data-nav="home">Home</a>
                <a href="bookings.html" data-nav="bookings">My Bookings</a>
                <a href="cancel.html" data-nav="cancel">Cancel</a>
                <a href="reports.html" data-nav="reports">Reports</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" id="hero">
            <div class="hero-inner">
                <div class="hero-text">
                    <p class="eyebrow">Now showing</p>
                    <h1 class="hero-title" id="hero-title">CineBook</h1>
                    <p class="hero-meta" id="hero-meta"></p>
                    <p class="hero-copy">Pick a show, choose your seats on the live seat map and get your ticket with a booking ID. Regular, Premium and VIP rows are priced differently.</p>
                    <div class="actions">
                        <a class="btn btn-primary" id="hero-book" href="#shows">Book tickets</a>
                        <a class="btn btn-outline" href="bookings.html">My bookings</a>
                    </div>
                </div>
                <div class="poster poster-lg" id="hero-poster"></div>
            </div>
        </section>

        <section class="section" id="shows">
            <div class="section-head">
                <h2>All shows</h2>
                <p class="muted">Tap a show to choose seats</p>
            </div>
            <div class="show-grid" id="show-grid"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
