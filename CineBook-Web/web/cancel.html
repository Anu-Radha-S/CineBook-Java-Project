<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancel Booking | CineBook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="cancel">
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="index.html">Cine<span>Book</span></a>
            <nav class="nav">
                <a href="index.html" data-nav="home">Home</a>
                <a href="bookings.html" data-nav="bookings">My Bookings</a>
                <a href="cancel.html" data-nav="cancel">Cancel</a>
                <a href="reports.html" data-nav="reports">Reports</a>
            </nav>
        </div>
    </header>

    <main class="narrow">
        <p class="eyebrow">Cancellation</p>
        <h1 class="page-title">Cancel a booking</h1>
        <p class="muted">Cancelling frees your seats and refunds 80% of the amount you paid.</p>

        <div class="panel">
            <label class="field-label" for="cancel-id">Booking ID</label>
            <div class="inline-form">
                <input id="cancel-id" type="text" placeholder="e.g. BK1001" autocomplete="off">
                <button class="btn btn-danger-solid" id="cancel-btn">Cancel booking</button>
            </div>
        </div>

        <div class="refund" id="refund" hidden>
            <p class="ticket-label">Refund</p>
            <p class="refund-amount" id="refund-amount"></p>
            <p id="refund-detail"></p>
        </div>

        <div class="notice" id="cancel-message" hidden></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
